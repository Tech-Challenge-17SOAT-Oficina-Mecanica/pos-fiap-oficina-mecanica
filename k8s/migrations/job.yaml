apiVersion: batch/v1
kind: Job
metadata:
  name: oficina-migrations
  namespace: oficina
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: oficina-migrations
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: flyway
          image: oficina-migrations:local
          args: [migrate]
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: oficina-api-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: oficina-api-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: oficina-api-config
                  key: DB_NAME
            - name: FLYWAY_URL
              value: jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: oficina-api-secret
                  key: DB_USER
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-api-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
