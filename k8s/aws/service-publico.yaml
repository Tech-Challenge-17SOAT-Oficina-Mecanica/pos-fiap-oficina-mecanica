apiVersion: v1
kind: Service
metadata:
  name: oficina-api
  namespace: oficina
  annotations:
    # EKS tradicional: NLB pelo controlador integrado, sem instalar o AWS LBC.
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-internal: "false"
spec:
  type: LoadBalancer
