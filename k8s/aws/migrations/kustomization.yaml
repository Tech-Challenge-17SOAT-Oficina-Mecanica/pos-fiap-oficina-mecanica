apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/migrations
patches:
  - target:
      kind: Job
      name: oficina-migrations
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/env/3/name
        value: FLYWAY_URL
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=verify-full&sslrootcert=/flyway/certs/aws-rds-global-bundle.pem
