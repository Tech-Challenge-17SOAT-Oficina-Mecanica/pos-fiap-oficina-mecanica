openapi: 3.0.3
info:
  title: Oficina Mecânica API
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: Veículos
  - name: Orçamento
  - name: Fornecedores
  - name: Estoque
  - name: Mecânico
  - name: Orçamento
  - name: Serviço
paths:
  /ordens-servico:
    get:
      tags: [Ordem de Serviço]
      summary: Lista ordens de serviço com filtros e paginação
      description: >-
        Exige o escopo `os:ler`. `documento` e `placa` só filtram cadastros existentes: sem
        correspondência, retorna `404`. Sem resultado para os filtros, retorna `200` com `data: []`.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [RECEBIDA, EM_DIAGNOSTICO, AGUARDANDO_APROVACAO, AGUARDANDO_RECURSOS, AGUARDANDO_EXECUCAO, EM_EXECUCAO, FINALIZADA, ENTREGUE, CANCELADA]
        - name: documento
          in: query
          schema: { type: string }
          description: CPF ou CNPJ do cliente, com ou sem máscara.
        - name: placa
          in: query
          schema: { type: string }
        - name: pagina
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: tamanho
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Listagem paginada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaOrdensServico' }
        '400':
          description: Status, documento, placa ou paginação inválidos
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo os:ler }
        '404': { description: Cliente ou veículo do filtro não encontrado }
    post:
      tags: [Ordem de Serviço]
      summary: Cria uma ordem de serviço
      description: Cria a OS com status RECEBIDA para um veículo ativo vinculado ao cliente informado. Exige o escopo `os:escrever`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clienteId, veiculoId]
              additionalProperties: false
              properties:
                clienteId: { type: string, format: uuid }
                veiculoId: { type: string, format: uuid }
      responses:
        '201': { description: Ordem de serviço criada }
        '400': { description: Corpo ou identificadores inválidos }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo os:escrever }
        '404': { description: Cliente ou veículo não encontrado }
        '409': { description: Veículo não vinculado ao cliente informado }
  /ordens-servico/{osId}/problema-relatado:
    post:
      tags: [Ordem de Serviço]
      summary: Registra o problema relatado pelo cliente
      description: >-
        Registra o relato inicial em uma OS RECEBIDA e, na mesma operação, altera o status
        para EM_DIAGNOSTICO e grava a data de início do diagnóstico. Exige o escopo `os:escrever`.
      security:
        - bearerAuth: []
      parameters:
        - name: osId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descricao]
              additionalProperties: false
              properties:
                descricao: { type: string, minLength: 1, example: Veículo apresenta ruído ao frear }
                observacoes: { type: string, example: O problema começou há uma semana }
      responses:
        '201':
          description: Problema relatado registrado e diagnóstico iniciado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ordemServicoId: { type: string, format: uuid }
                  problemaRelatado:
                    type: object
                    properties:
                      descricao: { type: string }
                      observacoes: { type: string }
                  status: { type: string, enum: [EM_DIAGNOSTICO] }
                  dataInicioDiagnostico: { type: string, format: date-time }
        '400': { description: Identificador ou corpo inválido }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo os:escrever }
        '404': { description: Ordem de serviço não encontrada }
        '409': { description: OS fora de RECEBIDA ou problema relatado já registrado }
  /health:
    get:
      summary: Verifica a disponibilidade da API
      responses:
        '200': { description: API disponível }
  /orcamentos/{orcamentoId}/aprovar:
    post:
      tags: [Orçamento]
      summary: Aprova um orçamento
      description: >-
        Registra a aprovação do cliente, reserva o saldo disponível de peças e insumos do orçamento
        e atualiza a OS para AGUARDANDO_EXECUCAO ou AGUARDANDO_RECURSOS quando houver pendência de compra.
        Exige token de cliente com escopo `orcamentos:decidir`.
      security:
        - bearerAuth: []
      parameters:
        - name: orcamentoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Orçamento aprovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrcamentoAprovado' }
        '400':
          description: Identificador inválido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Cliente sem acesso ao orçamento desta OS }
        '404': { description: Orçamento não encontrado }
        '409':
          description: Orçamento já decidido, OS fora de aprovação ou complementar sem vínculo válido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /servicos:
    post:
      tags: [Serviço]
      summary: Cadastra um serviço no catálogo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, valor, tempoEstimadoMinutos]
              additionalProperties: false
              properties:
                nome:
                  type: string
                  example: Troca de óleo
                descricao:
                  type: string
                  example: Troca de óleo e filtro
                valor:
                  type: number
                  format: double
                  minimum: 0
                  example: 150.00
                tempoEstimadoMinutos:
                  type: integer
                  minimum: 1
                  example: 60
      responses:
        '201':
          description: Serviço cadastrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  codigo: { type: string, pattern: '^SER-[0-9]{6}$', example: SER-000004 }
                  nome: { type: string }
                  descricao: { type: string }
                  valor: { type: number, format: double }
                  tempoEstimadoMinutos: { type: integer }
                  ativo: { type: boolean, example: true }
                  version: { type: integer, example: 1 }
                  dataCriacao: { type: string, format: date-time }
        '400': { description: Dados obrigatórios ausentes ou inválidos }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo servicos:escrever }
        '409': { description: Serviço ativo com o mesmo nome normalizado }
        '500': { description: Falha inesperada }
  /fornecedores:
    get:
      tags: [Fornecedores]
      summary: Lista fornecedores cadastrados
      security:
        - bearerAuth: []
      parameters:
        - name: nome
          in: query
          schema: { type: string }
          description: Filtro parcial por razão social ou nome fantasia.
        - name: documento
          in: query
          schema: { type: string }
          description: Filtro exato por CPF/CNPJ, com ou sem máscara.
        - name: incluirInativos
          in: query
          schema: { type: boolean, default: false }
        - name: pagina
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: tamanho
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200': { description: Consulta realizada }
        '400': { description: Filtros ou paginação inválidos }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo compras:ler }
    post:
      tags: [Fornecedores]
      summary: Cadastra um fornecedor
      description: Exige o escopo `compras:escrever`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastrarFornecedor' }
      responses:
        '201':
          description: Fornecedor cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fornecedor' }
        '400': { description: Dados inválidos }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo compras:escrever }
        '409': { description: Documento duplicado }
  /fornecedores/{fornecedorId}:
    get:
      tags: [Fornecedores]
      summary: Consulta um fornecedor pelo identificador
      security:
        - bearerAuth: []
      parameters:
        - name: fornecedorId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Fornecedor encontrado }
        '400': { description: Identificador inválido }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo compras:ler }
        '404': { description: Fornecedor não encontrado }
    put:
      tags: [Fornecedores]
      summary: Atualiza um fornecedor
      security:
        - bearerAuth: []
      parameters:
        - name: fornecedorId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-Match
          in: header
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtualizarFornecedor' }
      responses:
        '200': { description: Fornecedor atualizado }
        '400': { description: Dados inválidos ou campo imutável enviado }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo compras:escrever }
        '404': { description: Fornecedor não encontrado }
        '409': { description: Fornecedor inativo }
        '412': { description: If-Match divergente }
        '428': { description: If-Match não informado }
    delete:
      tags: [Fornecedores]
      summary: Desativa um fornecedor
      security:
        - bearerAuth: []
      parameters:
        - name: fornecedorId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Fornecedor desativado }
        '400': { description: Identificador inválido }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo compras:escrever }
        '404': { description: Fornecedor não encontrado }
        '409': { description: Fornecedor já inativo ou com pedido de compra em aberto }
  /fornecedores/{fornecedorId}/reativacao:
    post:
      tags: [Fornecedores]
      summary: Reativa um fornecedor
      security:
        - bearerAuth: []
      parameters:
        - name: fornecedorId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Fornecedor reativado }
        '400': { description: Identificador inválido }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo compras:escrever }
        '404': { description: Fornecedor não encontrado }
        '409': { description: Fornecedor já ativo ou documento já utilizado }
  /mecanicos/{mecanicoId}:
    put:
      tags: [Mecânico]
      summary: Atualiza cadastro e escopos de um mecânico
      description: Exige o escopo `mecanicos:escrever`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: mecanicoId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
            example: '1'
          description: Version atual do mecânico para controle otimista.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, escopos]
              properties:
                nome:
                  type: string
                  example: Maria Souza
                email:
                  type: string
                  format: email
                  example: maria.souza@oficina.local
                escopos:
                  type: array
                  items:
                    type: string
                  example: [veiculos:ler, veiculos:escrever, os:ler]
      responses:
        '200':
          description: Mecânico atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nome: { type: string }
                  email: { type: string, format: email }
                  ativo: { type: boolean }
                  escopos:
                    type: array
                    items:
                      type: string
                  version: { type: integer }
        '400': { description: Identificador, corpo, e-mail, If-Match ou escopo inválido }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo mecanicos:escrever }
        '404': { description: Mecânico não encontrado }
        '409': { description: E-mail já cadastrado para outro usuário }
        '412': { description: If-Match divergente }
        '428': { description: If-Match ausente }
  /veiculos:
    get:
      tags: [Veículos]
      summary: Consulta um veículo pela placa
      description: Exige o escopo `veiculos:ler`.
      security:
        - bearerAuth: []
      parameters:
        - name: placa
          in: query
          required: true
          schema: { type: string, example: ABC1D23 }
        - name: incluirInativos
          in: query
          required: true
          schema: { type: boolean }
      responses:
        '200': { description: Veículo encontrado }
        '400': { description: Parâmetros inválidos }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo veiculos:ler }
        '404': { description: Veículo não encontrado }
  /clientes/{clienteId}/veiculos:
    post:
      tags: [Veículos]
      summary: Cadastra um veículo e o vincula ao cliente
      description: Exige o escopo `veiculos:escrever`.
      security:
        - bearerAuth: []
      parameters:
        - name: clienteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastrarVeiculo' }
      responses:
        '201': { description: Veículo cadastrado }
        '400': { description: Dados inválidos }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo veiculos:escrever }
        '404': { description: Cliente não encontrado }
        '409': { description: Cliente inativo ou placa já cadastrada }
  /clientes:
    get:
      tags: [Cliente]
      summary: Consulta cliente por CPF/CNPJ
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: documento
          required: true
          schema:
            type: string
            example: '39053344705'
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nome: { type: string }
                  documento: { type: string }
                  tipoDocumento: { type: string, enum: [CPF, CNPJ] }
                  telefone: { type: string }
                  email: { type: string, format: email }
                  ativo: { type: boolean }
                  version: { type: integer }
                  veiculos:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        placa: { type: string }
                        marca: { type: string }
                        modelo: { type: string }
                        ano: { type: integer }
        '400': { description: CPF/CNPJ ausente ou inválido }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo clientes:ler }
        '404': { description: Cliente não encontrado }
    post:
      tags: [Cliente]
      summary: Cadastra um cliente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, documento, tipoDocumento]
              properties:
                nome:
                  type: string
                  example: Ana Martins
                documento:
                  type: string
                  example: '12345678909'
                tipoDocumento:
                  type: string
                  enum: [CPF, CNPJ]
                telefone:
                  type: string
                  example: '11988887777'
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Cliente cadastrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nome: { type: string }
                  documento: { type: string }
                  tipoDocumento: { type: string, enum: [CPF, CNPJ] }
                  telefone: { type: string }
                  email: { type: string, format: email }
        '400': { description: Dados obrigatórios ausentes ou inválidos }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo clientes:escrever }
        '409': { description: Cliente já cadastrado }
  /clientes/{clienteId}:
    put:
      tags: [Cliente]
      summary: Atualiza um cliente
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clienteId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
            example: '1'
          description: Version atual do cliente para controle otimista.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, documento, tipoDocumento]
              properties:
                nome:
                  type: string
                  example: Ana Martins
                documento:
                  type: string
                  example: '39053344705'
                tipoDocumento:
                  type: string
                  enum: [CPF, CNPJ]
                telefone:
                  type: string
                  example: '11988887777'
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Cliente atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nome: { type: string }
                  documento: { type: string }
                  tipoDocumento: { type: string, enum: [CPF, CNPJ] }
                  telefone: { type: string }
                  email: { type: string, format: email }
                  ativo: { type: boolean }
                  version: { type: integer }
        '400': { description: Identificador, dados ou If-Match inválidos }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo clientes:escrever }
        '404': { description: Cliente não encontrado }
        '409': { description: CPF/CNPJ já vinculado a outro cliente }
        '412': { description: If-Match divergente }
        '428': { description: If-Match não informado }
    delete:
      tags: [Cliente]
      summary: Inativa um cliente
      description: Executa exclusão lógica do cliente e inativa os veículos vinculados.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clienteId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: motivo
          required: false
          schema:
            type: string
            maxLength: 200
            example: Cadastro duplicado
      responses:
        '200':
          description: Cliente inativado
          content:
            application/json:
              schema:
                type: object
                properties:
                  clienteId: { type: string, format: uuid }
                  nome: { type: string }
                  ativo: { type: boolean, example: false }
                  inativadoEm: { type: string, format: date-time }
                  inativadoPor: { type: string, format: uuid }
                  motivo: { type: string }
                  veiculosInativados:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        placa: { type: string }
                  documentoLiberadoParaNovoCadastro: { type: boolean, example: true }
        '204': { description: Cliente já estava inativo }
        '400': { description: clienteId inválido ou motivo acima do limite }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo clientes:escrever }
        '404': { description: Cliente não encontrado }
        '409':
          description: Cliente possui Ordem de Serviço em aberto
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type: { type: string, example: 'https://api.oficina-mecanica.dev/errors/cliente-com-os-aberta' }
                  title: { type: string, example: Cliente possui Ordem de Serviço em aberto }
                  status: { type: integer, example: 409 }
                  detail: { type: string }
                  erros:
                    type: array
                    items:
                      type: object
                      properties:
                        ordemServicoId: { type: string, format: uuid }
                        status: { type: string, example: EM_EXECUCAO }
  /veiculos/{veiculoId}:
    put:
      tags: [Veículos]
      summary: Atualiza os dados de um veículo
      description: Exige o escopo `veiculos:escrever`.
      security:
        - bearerAuth: []
      parameters:
        - name: veiculoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-Match
          in: header
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastrarVeiculo' }
      responses:
        '200': { description: Veículo atualizado }
        '400': { description: Dados inválidos }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo veiculos:escrever }
        '404': { description: Veículo não encontrado }
        '409': { description: Placa já cadastrada }
        '412': { description: Versão divergente }
        '428': { description: If-Match ausente }
    delete:
      tags: [Veículos]
      summary: Inativa um veículo
      security:
        - bearerAuth: []
      parameters:
        - name: veiculoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: motivo
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        '200': { description: Veículo inativado }
        '204': { description: Veículo já inativo }
        '400': { description: Identificador ou motivo inválido }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo veiculos:escrever }
        '404': { description: Veículo não encontrado }
        '409': { description: Veículo possui OS em aberto }
  /veiculos/{veiculoId}/reativacao:
    post:
      tags: [Veículos]
      summary: Reativa um veículo
      security:
        - bearerAuth: []
      parameters:
        - name: veiculoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Veículo reativado }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo veiculos:escrever }
        '404': { description: Veículo não encontrado }
        '409': { description: Veículo ativo, placa em uso ou cliente inativo }
  /clientes/{clienteId}/reativacao:
    post:
      tags: [Cliente]
      summary: Reativa um cliente
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clienteId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cliente reativado
          content:
            application/json:
              schema:
                type: object
                properties:
                  clienteId: { type: string, format: uuid }
                  nome: { type: string }
                  ativo: { type: boolean, example: true }
                  reativadoEm: { type: string, format: date-time }
                  reativadoPor: { type: string, format: uuid }
                  veiculosReativados: { type: integer, example: 0 }
        '400': { description: clienteId inválido }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo clientes:escrever }
        '404': { description: Cliente não encontrado }
        '409': { description: Cliente já ativo ou CPF/CNPJ usado por outro cliente ativo }
  /estoque/pecas:
    get:
      tags: [Estoque]
      summary: Consulta peças com saldo físico, reservado e disponível
      description: Exige o escopo `estoque:ler`. Informe ao menos `codigo` ou `descricao`.
      security:
        - bearerAuth: []
      parameters:
        - name: codigo
          in: query
          schema: { type: string }
          description: Filtro exato pelo código funcional, por exemplo `PEC-000001`.
        - name: descricao
          in: query
          schema: { type: string, minLength: 2 }
          description: Filtro parcial pela descrição.
        - name: categoriaId
          in: query
          schema: { type: string, format: uuid }
        - name: fabricante
          in: query
          schema: { type: string }
          description: Filtro parcial pelo fabricante.
        - name: quantidadeDesejada
          in: query
          schema: { type: integer, minimum: 1 }
          description: Quando informada, a resposta indica se cada peça atende a quantidade.
        - name: somenteDisponiveis
          in: query
          schema: { type: boolean, default: false }
          description: Aceita apenas `true` ou `false`; outro valor devolve 400.
        - name: incluirInativos
          in: query
          schema: { type: boolean, default: false }
          description: Aceita apenas `true` ou `false`; outro valor devolve 400.
        - name: pagina
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: tamanho
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Consulta realizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaPecas' }
        '400':
          description: Filtros, booleanos ou paginação inválidos
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo estoque:ler }
        '404': { description: Nenhuma peça corresponde aos parâmetros }
    post:
      tags: [Estoque]
      summary: Cadastra uma nova peça no catálogo
      description: >-
        Exige o escopo `estoque:escrever`. O `codigo` é gerado pelo sistema no formato
        `PEC-000001`. O cadastro não aceita saldo inicial: todo saldo entra por
        movimentação de entrada.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastrarPeca' }
      responses:
        '201':
          description: Peça cadastrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Peca' }
        '400':
          description: Dados inválidos, ou categoria inexistente ou inativa
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo estoque:escrever }
        '409':
          description: Já existe peça ativa com a mesma descrição na categoria
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /estoque/solicitacoes-compra-reserva:
    post:
      tags: [Estoque]
      summary: Reserva peças disponíveis e solicita compra do faltante
      description: >-
        Exige o escopo `estoque:movimentar` e o header `Idempotency-Key`. Processa apenas
        itens do tipo `PECA` de uma OS com orçamento aprovado: reserva o saldo disponível,
        cria pedido de compra para a quantidade faltante e atualiza a OS para
        `AGUARDANDO_EXECUCAO` ou `AGUARDANDO_RECURSOS`.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitarCompraReservaPecas' }
      responses:
        '201':
          description: Reservas e/ou pedido de compra criados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoCompraReservaPecas' }
        '200':
          description: Mesma Idempotency-Key reprocessada; resposta original devolvida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoCompraReservaPecas' }
        '400':
          description: Header, corpo, identificadores, lista de itens ou quantidade inválidos
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo estoque:movimentar }
        '404':
          description: Ordem de serviço, fornecedor ou peça não encontrada
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409':
          description: OS sem orçamento aprovado, fornecedor inativo, item inativo, item fora da OS/orçamento ou processamento duplicado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /estoque/pecas/{pecaId}:
    get:
      tags: [Estoque]
      summary: Consulta uma peça específica, com version para o If-Match
      description: Exige o escopo `estoque:ler`.
      security:
        - bearerAuth: []
      parameters:
        - name: pecaId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: quantidadeDesejada
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Peça encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Peca' }
        '400':
          description: Identificador ou quantidade inválidos
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo estoque:ler }
        '404': { description: Peça não encontrada }
    put:
      tags: [Estoque]
      summary: Atualiza os dados cadastrais da peça
      description: >-
        Exige o escopo `estoque:escrever` e o header `If-Match` com a `version` atual.
        Não altera `ativo`, `codigo` nem saldo: a situação muda apenas pelo `DELETE`, onde
        as validações de reserva e orçamento existem. Quando `precoVenda` muda, a alteração
        é registrada no histórico de preço.
      security:
        - bearerAuth: []
      parameters:
        - name: pecaId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
          description: 'Version atual da peça. Aceita `3` ou `"3"`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtualizarPeca' }
      responses:
        '200':
          description: Peça atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Peca' }
        '400':
          description: Dados inválidos, `ativo` no corpo, categoria inexistente ou inativa, ou If-Match malformado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo estoque:escrever }
        '404': { description: Peça não encontrada }
        '409':
          description: Já existe peça ativa com a mesma descrição na categoria
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '412':
          description: If-Match diverge da version atual
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '428':
          description: If-Match não informado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
    delete:
      tags: [Estoque]
      summary: Desativa a peça (exclusão lógica)
      description: >-
        Exige o escopo `estoque:escrever`. A peça não é removida: fica inativa, com data e
        usuário responsável registrados. Bloqueado com saldo reservado em OS ativa ou com a
        peça em orçamento no status CRIADO.
      security:
        - bearerAuth: []
      parameters:
        - name: pecaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Peça desativada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PecaDesativada' }
        '400':
          description: Identificador inválido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo estoque:escrever }
        '404': { description: Peça não encontrada }
        '409':
          description: Peça já inativa, com saldo reservado em OS ou em orçamento
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /estoque/solicitacoes-compra-reserva-insumos:
    post:
      tags: [Estoque]
      summary: Processa insumos para reserva e compra
      description: >-
        Reserva o saldo disponível dos insumos de uma OS com orçamento aprovado e cria pedido
        de compra apenas para a quantidade faltante. Exige `Idempotency-Key` e o escopo
        `estoque:movimentar`.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
          description: Chave UUID que impede reprocessamento da mesma solicitação.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcessarInsumosCompraReserva' }
      responses:
        '201':
          description: Reservas e/ou solicitação de compra criadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoProcessarInsumosCompraReserva' }
        '200':
          description: Resposta original de uma solicitação idempotente já processada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoProcessarInsumosCompraReserva' }
        '400':
          description: Header ou corpo inválido, lista vazia, item repetido ou quantidade inválida
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo estoque:movimentar }
        '404': { description: OS, fornecedor ou insumo não encontrado }
        '409':
          description: OS sem orçamento aprovado, fornecedor/insumo inativo, item fora da OS/orçamento ou processamento duplicado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /estoque/insumos:
    get:
      tags: [Estoque]
      summary: Consulta insumos por filtros e disponibilidade
      description: Exige o escopo `estoque:ler`. Retorna envelope paginado e não altera saldo, reserva ou pedido.
      security:
        - bearerAuth: []
      parameters:
        - name: codigo
          in: query
          schema: { type: string, example: INS-000001 }
          description: Código exato do insumo.
        - name: descricao
          in: query
          schema: { type: string, minLength: 2 }
          description: Filtro parcial pela descrição.
        - name: categoriaId
          in: query
          schema: { type: string, format: uuid }
        - name: quantidadeDesejada
          in: query
          schema: { type: number, format: double, minimum: 0, exclusiveMinimum: true, example: 3.5 }
          description: Quando informada, a resposta indica se cada insumo atende a quantidade.
        - name: somenteDisponiveis
          in: query
          schema: { type: boolean, default: false }
          description: Quando true, exige quantidadeDesejada e filtra saldo suficiente.
        - name: incluirInativos
          in: query
          schema: { type: boolean, default: false }
        - name: pagina
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: tamanho
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Consulta realizada, inclusive lista vazia ou quantidade insuficiente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaInsumos' }
        '400':
          description: Filtros, quantidade, booleanos ou paginação inválidos
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo estoque:ler }
    post:
      tags: [Estoque]
      summary: Cadastra um novo insumo no catálogo
      description: >-
        Exige o escopo `estoque:escrever`. O `codigo` é gerado pelo sistema no formato
        `INS-000001`. Insumo admite quantidade fracionada, diferente da peça. Não há
        conversão entre unidades: cada unidade é um item independente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastrarInsumo' }
      responses:
        '201':
          description: Insumo cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Insumo' }
        '400':
          description: Dados inválidos, unidade fora do enum, ou categoria inexistente ou inativa
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo estoque:escrever }
        '409':
          description: Já existe insumo ativo com a mesma descrição na categoria e unidade
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /estoque/insumos/{insumoId}:
    get:
      tags: [Estoque]
      summary: Consulta um insumo específico e sua disponibilidade
      description: Exige o escopo `estoque:ler`.
      security:
        - bearerAuth: []
      parameters:
        - name: insumoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: quantidadeDesejada
          in: query
          schema: { type: number, format: double, minimum: 0, exclusiveMinimum: true, example: 3.5 }
      responses:
        '200':
          description: Insumo encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsumoConsulta' }
        '400':
          description: Identificador ou quantidade inválidos
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo estoque:ler }
        '404': { description: Insumo não encontrado }
    delete:
      tags: [Estoque]
      summary: Desativa um insumo
      description: >-
        Realiza exclusão lógica do insumo. A operação é bloqueada quando houver saldo
        reservado em ordem de serviço ou orçamento aguardando aprovação.
      security:
        - bearerAuth: []
      parameters:
        - name: insumoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Insumo desativado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsumoDesativado' }
        '400':
          description: Identificador inválido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo estoque:escrever }
        '404': { description: Insumo não encontrado }
        '409':
          description: Insumo já inativo, reservado em OS ou presente em orçamento aguardando aprovação
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /estoque/entradas:
    post:
      tags: [Estoque]
      summary: Registra a entrada de peças e insumos, compartilhada entre os dois contextos
      description: >-
        Exige o escopo `estoque:movimentar`. Aumenta o saldo físico dos itens recebidos,
        efetiva as reservas vinculadas a pedido de compra e libera para `AGUARDANDO_EXECUCAO`
        as ordens de serviço sem itens pendentes de compra. O header `Idempotency-Key` é
        obrigatório: a repetição da mesma chave devolve `200` com a resposta original.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrarEntrada' }
      responses:
        '201':
          description: Entrada registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntradaRegistrada' }
        '200':
          description: Requisição repetida com a mesma Idempotency-Key; devolve a resposta original
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntradaRegistrada' }
        '400':
          description: >-
            Body inválido, Idempotency-Key ausente ou inválida, item repetido, quantidade ou
            custo inválidos
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo estoque:movimentar }
        '404': { description: Item ou pedido de compra não encontrado }
        '409':
          description: >-
            Item inativo, documentoOrigem já registrado, item fora do pedido informado ou
            quantidade recebida maior que a pedida sem confirmarDivergencia
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /orcamentos/{orcamentoId}/calcular:
    post:
      tags: [Orçamento]
      summary: Calcula os itens e o valor total geral do orçamento
      description: >-
        Exige o escopo `orcamentos:escrever`. Recalcula `valorTotal` de cada item como
        `quantidade x valorUnitario` e devolve o `valorTotalGeral` da OS, somando o
        orçamento principal e os complementares com status `CRIADO` ou `APROVADO`.
        Orçamentos `RECUSADO` ficam de fora. Não altera o status do orçamento.
        Calcula também a estimativa de entrega em dias e a persiste no orçamento, sem
        alterar o status. A fila só entra quando `CAPACIDADE_DIARIA_OS` está configurada.
      security:
        - bearerAuth: []
      parameters:
        - name: orcamentoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Orçamento calculado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalculoOrcamento' }
        '400':
          description: Identificador inválido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo orcamentos:escrever }
        '404': { description: Orçamento não encontrado }
        '409':
          description: Orçamento não está em CRIADO, é complementar sem principal, ou não tem itens válidos
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /autenticacao/login:
    post:
      tags: [Segurança]
      summary: Autentica um mecânico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  format: email
                  example: mecanico@oficina.local
                senha:
                  type: string
                  format: password
                  example: mecanico123
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, example: Bearer }
                  expiresIn: { type: integer, example: 3600 }
        '400': { description: Dados inválidos }
        '401': { description: Credenciais inválidas }
  /ordens-servico/{osId}/pecas:
    post:
      tags: [Ordem de Serviço]
      summary: Registra peças necessárias na OS
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: osId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarItensOS'
      responses:
        '201': { description: Peças registradas e orçamento atualizado }
        '400': { description: Dados inválidos ou tipo de item divergente }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo os:escrever }
        '404': { description: OS ou item não encontrado }
        '409': { description: OS ou item em estado incompatível }
  /ordens-servico/{osId}/execucao/iniciar:
    post:
      tags: [Ordem de Serviço]
      summary: Inicia a execução da OS
      description: >-
        Exige o escopo `os:escrever` e um usuário cadastrado como mecânico. A OS deve estar na
        fila (`AGUARDANDO_EXECUCAO`), possuir orçamento aprovado com serviço autorizado e ter
        todas as peças e insumos necessários reservados. Sem itens de estoque, a execução é
        permitida. O mecânico responsável existente é preservado; sem vínculo, o mecânico
        autenticado é associado.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: osId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Execução iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InicioExecucao' }
        '400': { description: osId inválido }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem escopo os:escrever ou sem cadastro de mecânico }
        '404': { description: OS não encontrada }
        '409': { description: OS fora da fila, orçamento ou serviço não aprovado, ou recurso sem reserva }

  /ordens-servico/{osId}/tempo-execucao:
    get:
      tags: [Ordem de Serviço]
      summary: Consulta o tempo de execução de uma OS
      description: Calcula a diferença entre o início e a finalização já registrados na OS. Exige o escopo `os:ler`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: osId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tempo de execução calculado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TempoExecucao' }
        '400': { description: osId inválido ou OS sem início e finalização registrados }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo os:ler }
        '404': { description: OS não encontrada }

  /ordens-servico/tempos-execucao:
    get:
      tags: [Ordem de Serviço]
      summary: Lista tempos de execução e o tempo médio
      description: >-
        Considera somente OS com início e finalização registrados. Os filtros de período são
        aplicados à data de início da execução e o tempo médio considera todas as OS elegíveis,
        não apenas a página atual. Exige o escopo `os:ler`.
      security:
        - bearerAuth: []
      parameters:
        - name: dataInicio
          in: query
          schema: { type: string, format: date }
        - name: dataFim
          in: query
          schema: { type: string, format: date }
        - name: pagina
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: tamanho
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Indicador e lista paginada; sem OS elegível, retorna data vazia e indicador zerado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaTemposExecucao' }
        '400': { description: Paginação ou período inválido }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo os:ler }

  /ordens-servico/{osId}/finalizar:
    post:
      tags: [Ordem de Serviço]
      summary: Finaliza a execução da OS
      description: >-
        Exige o escopo `os:escrever`. A OS precisa estar `EM_EXECUCAO`, sem serviços autorizados
        pendentes, sem orçamento complementar aguardando decisão e sem reserva ativa da OS sem
        baixa de estoque registrada.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: osId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                observacoes: { type: string, example: Todos os serviços autorizados foram concluídos. }
      responses:
        '200':
          description: OS finalizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finalizacao' }
        '400':
          description: osId ou corpo inválidos
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo os:escrever }
        '404': { description: OS não encontrada }
        '409':
          description: >-
            OS fora de EM_EXECUCAO, serviço autorizado pendente, orçamento complementar aguardando
            decisão, ou reserva ativa sem baixa de estoque (lista os itens em `erros`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /ordens-servico/{osId}/entrega:
    post:
      tags: [Ordem de Serviço]
      summary: Registra a entrega do veículo
      description: >-
        Exige o escopo `os:escrever`. A OS precisa estar `FINALIZADA`. O valor final é calculado
        a partir dos orçamentos aprovados e registrado junto da entrega; pagamento permanece fora
        do MVP.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: osId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                clienteId: { type: string, format: uuid, description: Cliente ou responsável que retirou o veículo }
                observacoes: { type: string, example: Veículo entregue sem ressalvas. }
      responses:
        '200':
          description: Veículo entregue e OS encerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntregaVeiculo' }
        '400': { description: osId, clienteId ou corpo inválidos }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo os:escrever }
        '404': { description: OS ou cliente da retirada não encontrado }
        '409': { description: OS não está FINALIZADA, veículo já entregue ou valor final indisponível }
  /ordens-servico/{osId}:
    get:
      tags: [Ordem de Serviço]
      summary: Detalha a OS com cliente, veículo, problemas, orçamentos e histórico de eventos
      description: >-
        Exige o escopo `os:ler`. O cliente autenticado com token de escopo reduzido só acessa
        a própria OS.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: osId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalhe consolidado da OS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultaOS' }
        '400': { description: osId inválido }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo necessário, ou cliente consultando OS de outro cliente }
        '404': { description: OS não encontrada }
  /ordens-servico/{osId}/insumos:
    post:
      tags: [Ordem de Serviço]
      summary: Registra insumos necessários na OS
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: osId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarItensOS'
      responses:
        '201': { description: Insumos registrados e orçamento atualizado }
        '400': { description: Dados inválidos ou tipo de item divergente }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo os:escrever }
        '404': { description: OS ou item não encontrado }
        '409': { description: OS ou item em estado incompatível }
  /ordens-servico/{osId}/orcamento:
    get:
      tags: [Ordem de Serviço]
      summary: Consulta os orçamentos da OS
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: osId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Orçamentos principal e complementares
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrcamentoOS'
        '400': { description: osId inválido }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo os:ler }
        '404': { description: OS não encontrada }
  /orcamentos/{orcamentoId}/recusar:
    post:
      tags: [Orçamento]
      summary: Recusa um orçamento principal ou complementar
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orcamentoId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                motivo: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Orçamento recusado
          content:
            application/json:
              schema:
                type: object
                properties:
                  orcamentoId: { type: string, format: uuid }
                  ordemServicoId: { type: string, format: uuid }
                  tipoOrcamento: { type: string, enum: [PRINCIPAL, COMPLEMENTAR] }
                  orcamentoOriginalId: { type: string, format: uuid }
                  statusOrcamento: { type: string, enum: [RECUSADO] }
                  statusOrdemServico: { type: string }
                  clienteId: { type: string, format: uuid }
                  dataRecusa: { type: string, format: date-time }
                  motivo: { type: string }
        '400': { description: orcamentoId, corpo ou motivo inválidos }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo orcamentos:decidir, ou cliente sem acesso a este orçamento }
        '404': { description: Orçamento não encontrado }
        '409': { description: Orçamento já decidido, ou complementar sem orçamento principal vinculado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegistrarItensOS:
      type: object
      required: [itens]
      additionalProperties: false
      properties:
        itens:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, quantidade]
            additionalProperties: false
            properties:
              itemId: { type: string, format: uuid }
              quantidade: { type: number, exclusiveMinimum: 0 }
    InicioExecucao:
      type: object
      required: [ordemServicoId, status, mecanicoId, dataInicioExecucao]
      properties:
        ordemServicoId: { type: string, format: uuid }
        status: { type: string, enum: [EM_EXECUCAO] }
        mecanicoId: { type: string, format: uuid }
        dataInicioExecucao: { type: string, format: date-time }

    TempoExecucao:
      type: object
      required: [ordemServicoId, dataInicioExecucao, dataFinalizacao, tempoExecucaoMinutos]
      properties:
        ordemServicoId: { type: string, format: uuid }
        dataInicioExecucao: { type: string, format: date-time }
        dataFinalizacao: { type: string, format: date-time }
        tempoExecucaoMinutos: { type: integer, minimum: 0 }

    ListaTemposExecucao:
      type: object
      required: [tempoMedioExecucaoMinutos, totalElementos, pagina, tamanho, totalPaginas, data]
      properties:
        tempoMedioExecucaoMinutos: { type: integer, minimum: 0 }
        totalElementos: { type: integer, minimum: 0 }
        pagina: { type: integer, minimum: 0 }
        tamanho: { type: integer, minimum: 1 }
        totalPaginas: { type: integer, minimum: 0 }
        data:
          type: array
          items: { $ref: '#/components/schemas/TempoExecucao' }

    Finalizacao:
      type: object
      required: [ordemServicoId, status, dataFinalizacao]
      properties:
        ordemServicoId: { type: string, format: uuid }
        status: { type: string, enum: [FINALIZADA] }
        dataFinalizacao: { type: string, format: date-time }
        observacoes: { type: string }
    EntregaVeiculo:
      type: object
      required: [ordemServicoId, status, valorFinal, responsavelEntregaId, dataEntrega]
      properties:
        ordemServicoId: { type: string, format: uuid }
        status: { type: string, enum: [ENTREGUE] }
        valorFinal: { type: number, format: double }
        responsavelEntregaId: { type: string, format: uuid }
        clienteId: { type: string, format: uuid }
        dataEntrega: { type: string, format: date-time }
        observacoes: { type: string }
    ListaOrdensServico:
      type: object
      description: Envelope paginado padrão da API.
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              ordemServicoId: { type: string, format: uuid }
              cliente:
                type: object
                properties:
                  clienteId: { type: string, format: uuid }
                  nome: { type: string }
                  documento: { type: string }
              veiculo:
                type: object
                properties:
                  veiculoId: { type: string, format: uuid }
                  placa: { type: string }
                  marca: { type: string }
                  modelo: { type: string }
              status: { type: string }
        pagina: { type: integer }
        tamanho: { type: integer }
        totalElementos: { type: integer }
        totalPaginas: { type: integer }
    ConsultaOS:
      type: object
      required: [ordemServicoId, statusOrdemServico, cliente, veiculo, problemas, orcamentos, valorTotalGeral, eventos]
      properties:
        ordemServicoId: { type: string, format: uuid }
        statusOrdemServico: { type: string }
        cliente:
          type: object
          properties:
            clienteId: { type: string, format: uuid }
            nome: { type: string }
            documento: { type: string }
        veiculo:
          type: object
          properties:
            veiculoId: { type: string, format: uuid }
            placa: { type: string }
            marca: { type: string }
            modelo: { type: string }
            ano: { type: integer }
        problemas:
          type: array
          items:
            type: object
            properties:
              problemaId: { type: string, format: uuid }
              descricao: { type: string }
              orcamentoId: { type: string, format: uuid }
              identificadoEm: { type: string, format: date-time }
        orcamentos:
          type: array
          items:
            type: object
            properties:
              orcamentoId: { type: string, format: uuid }
              tipo: { type: string, enum: [PRINCIPAL, COMPLEMENTAR] }
              orcamentoOriginalId: { type: string, format: uuid }
              itens:
                type: array
                items:
                  type: object
                  properties:
                    tipo: { type: string }
                    descricao: { type: string }
                    quantidade: { type: number }
                    valorUnitario: { type: number }
                    valorTotal: { type: number }
              valorTotal: { type: number }
              dataGeracao: { type: string, format: date-time }
        valorTotalGeral: { type: number }
        eventos:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              agregado: { type: string }
              agregadoId: { type: string, format: uuid }
              ordemServicoId: { type: string, format: uuid }
              tipoEvento: { type: string }
              statusAnterior: { type: string, nullable: true }
              statusNovo: { type: string, nullable: true }
              ocorridoEm: { type: string, format: date-time }
              registradoEm: { type: string, format: date-time }
    OrcamentoOS:
      type: object
      properties:
        ordemServicoId: { type: string, format: uuid }
        orcamentoId: { type: string, format: uuid }
        orcamentoOriginalId: { type: string, format: uuid }
        tipoOrcamento: { type: string, enum: [PRINCIPAL, COMPLEMENTAR] }
        statusOrcamento: { type: string, enum: [CRIADO, APROVADO, RECUSADO] }
        itensRegistrados:
          type: array
          items:
            $ref: '#/components/schemas/ItemOrcamentoOS'
        valorOrcamento: { type: number, format: double }
        valorTotalGeral: { type: number, format: double }
    ItemOrcamentoOS:
      type: object
      properties:
        itemId: { type: string, format: uuid }
        codigo: { type: string }
        descricao: { type: string }
        tipo: { type: string, enum: [PECA, INSUMO] }
        quantidade: { type: number }
        valorUnitario: { type: number, format: double }
        valorItem: { type: number, format: double }
    ServicoLista:
      type: object
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string, pattern: '^SER-[0-9]{6}$' }
        nome: { type: string }
        descricao: { type: string }
        valor: { type: number, format: double }
        tempoEstimadoMinutos: { type: integer }
        ativo: { type: boolean }
    Problema:
      type: object
      description: Resposta de erro no formato application/problem+json.
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        erros:
          type: array
          description: Presente quando a falha pode ser atribuída a um parâmetro específico.
          items:
            type: object
            properties:
              campo: { type: string }
              mensagem: { type: string }
    OrcamentoAprovado:
      type: object
      properties:
        orcamentoId: { type: string, format: uuid }
        ordemServicoId: { type: string, format: uuid }
        tipoOrcamento: { type: string, enum: [PRINCIPAL, COMPLEMENTAR] }
        orcamentoOriginalId: { type: string, format: uuid }
        statusOrcamento: { type: string, enum: [APROVADO] }
        statusOrdemServico: { type: string, enum: [AGUARDANDO_EXECUCAO, AGUARDANDO_RECURSOS] }
        clienteId: { type: string, format: uuid }
        dataAprovacao: { type: string, format: date-time }
    AtualizarPeca:
      type: object
      required: [nome, descricao, categoriaId, precoVenda]
      properties:
        nome: { type: string, minLength: 2, maxLength: 150 }
        descricao: { type: string, minLength: 3, maxLength: 120 }
        categoriaId: { type: string, format: uuid, description: Categoria existente e ativa. }
        fornecedorId: { type: string, format: uuid, nullable: true, description: Fornecedor padrão ativo para compra automática. }
        fabricante: { type: string, maxLength: 150, nullable: true }
        precoVenda:
          type: number
          format: double
          exclusiveMinimum: 0
          multipleOf: 0.01
          description: Obrigatório na atualização, maior que zero e com no máximo 2 casas decimais.
        estoqueMinimo: { type: integer, minimum: 0, default: 0 }
      additionalProperties: false
    CalculoOrcamento:
      type: object
      properties:
        orcamentoId: { type: string, format: uuid }
        ordemServicoId: { type: string, format: uuid }
        valorTotal:
          type: number
          format: double
          description: Soma dos itens deste orçamento.
        valorTotalGeral:
          type: number
          format: double
          description: Soma dos orçamentos CRIADO e APROVADO da OS.
        estimativaEntregaDias:
          type: integer
          minimum: 0
          description: >-
            Prazo em dias inteiros, sem data exata. Soma o maior prazo entre os itens
            indisponíveis, o tempo médio de execução das OS já finalizadas e os dias de
            fila. Parcelas sem dado valem zero: oficina sem histórico ou sem capacidade
            configurada recebe estimativa menor, e não erro.
    CadastrarPeca:
      type: object
      required: [nome, descricao, categoriaId]
      properties:
        nome: { type: string, minLength: 2, maxLength: 150 }
        descricao:
          type: string
          minLength: 3
          maxLength: 120
          description: Usada na regra de duplicidade, após normalização.
        categoriaId: { type: string, format: uuid, description: Categoria existente e ativa. }
        fornecedorId: { type: string, format: uuid, nullable: true, description: Fornecedor padrão ativo para compra automática. }
        fabricante: { type: string, maxLength: 150, nullable: true }
        precoVenda: { type: number, format: double, minimum: 0, nullable: true }
        estoqueMinimo: { type: integer, minimum: 0, default: 0 }
    Peca:
      type: object
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string, example: PEC-000001 }
        tipo: { type: string, enum: [PECA] }
        nome: { type: string }
        descricao: { type: string }
        categoriaId: { type: string, format: uuid }
        categoria: { type: string }
        fornecedorId: { type: string, format: uuid, nullable: true }
        fabricante: { type: string, nullable: true }
        unidadeMedida: { type: string, example: UN }
        precoVenda: { type: number, format: double, nullable: true }
        saldoFisico: { type: integer }
        saldoReservado: { type: integer }
        saldoDisponivel: { type: integer, description: Saldo físico menos o reservado. }
        quantidadeDesejada: { type: integer, description: Presente apenas quando informada na consulta. }
        quantidadeDisponivel: { type: boolean, description: Presente apenas quando quantidadeDesejada é informada. }
        estoqueMinimo: { type: integer }
        disponivel: { type: boolean }
        abaixoDoMinimo: { type: boolean }
        possuiPedidoEmAberto: { type: boolean }
        ativo: { type: boolean }
        version: { type: integer }
        dataCriacao:
          type: string
          format: date-time
          description: Devolvida apenas no cadastro.
        atualizadoEm:
          type: string
          format: date-time
          description: Devolvida apenas na atualização.
        atualizadoPor:
          type: string
          format: uuid
          description: Devolvida apenas na atualização.
    SolicitarCompraReservaPecas:
      type: object
      required: [ordemServicoId, fornecedorId, itens]
      additionalProperties: false
      properties:
        ordemServicoId: { type: string, format: uuid }
        fornecedorId: { type: string, format: uuid }
        itens:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, quantidade]
            additionalProperties: false
            properties:
              itemId: { type: string, format: uuid }
              quantidade: { type: integer, minimum: 1 }
    ResultadoCompraReservaPecas:
      type: object
      properties:
        ordemServicoId: { type: string, format: uuid }
        statusOrdemServico: { type: string, enum: [AGUARDANDO_EXECUCAO, AGUARDANDO_RECURSOS] }
        pecasReservadas:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string, format: uuid }
              quantidade: { type: integer, minimum: 1 }
              saldoDisponivelApos: { type: integer, minimum: 0 }
        pecasCompraSolicitada:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string, format: uuid }
              quantidade: { type: integer, minimum: 1 }
              valorParcial: { type: number, format: double, minimum: 0 }
        fornecedor:
          type: object
          properties:
            id: { type: string, format: uuid }
            nome: { type: string }
        valorTotalCompraParcial: { type: number, format: double, minimum: 0 }
    ListaPecas:
      type: object
      description: Envelope paginado padrão da API.
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Peca' }
        pagina: { type: integer }
        tamanho: { type: integer }
        totalElementos: { type: integer }
        totalPaginas: { type: integer }
    PecaDesativada:
      type: object
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nome: { type: string }
        ativo: { type: boolean, example: false }
        dataDesativacao: { type: string, format: date-time, nullable: true }
        usuarioDesativacao: { type: string, format: uuid, nullable: true }
    CadastrarInsumo:
      type: object
      required: [nome, descricao, categoriaId, unidadeMedida, custoUnitario]
      properties:
        nome: { type: string, minLength: 2, maxLength: 150 }
        descricao:
          type: string
          minLength: 3
          maxLength: 500
          description: Usada na regra de duplicidade, junto da categoria e da unidade.
        categoriaId: { type: string, format: uuid, description: Categoria existente e ativa. }
        fornecedorId: { type: string, format: uuid, nullable: true, description: Fornecedor padrão ativo para compra automática. }
        unidadeMedida: { type: string, enum: [UN, L, ML, KG, G, M] }
        custoUnitario: { type: number, format: double, minimum: 0 }
        estoqueMinimo:
          type: number
          format: double
          minimum: 0
          default: 0
          description: Aceita casas decimais, diferente da peça.
    Insumo:
      type: object
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string, example: INS-000001 }
        tipo: { type: string, enum: [INSUMO] }
        nome: { type: string }
        descricao: { type: string }
        categoriaId: { type: string, format: uuid }
        categoria: { type: string }
        fornecedorId: { type: string, format: uuid, nullable: true }
        unidadeMedida: { type: string, enum: [UN, L, ML, KG, G, M] }
        custoUnitario: { type: number, format: double, nullable: true }
        saldoFisico: { type: number, format: double }
        saldoReservado: { type: number, format: double }
        estoqueMinimo: { type: number, format: double }
        ativo: { type: boolean }
        version: { type: integer }
        dataCriacao:
          type: string
          format: date-time
          description: Devolvida apenas no cadastro.
    InsumoConsulta:
      allOf:
        - $ref: '#/components/schemas/Insumo'
        - type: object
          properties:
            quantidadeDesejada:
              type: number
              format: double
              description: Presente apenas quando informada na consulta.
            saldoDisponivel:
              type: number
              format: double
              description: Saldo físico menos o reservado.
            quantidadeDisponivel:
              type: boolean
              description: Presente apenas quando quantidadeDesejada é informada.
            disponivel: { type: boolean }
            abaixoDoMinimo: { type: boolean }
            possuiPedidoEmAberto: { type: boolean }
    InsumoDesativado:
      type: object
      required: [id, codigo, nome, unidadeMedida, ativo, dataDesativacao, usuarioDesativacao]
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string, example: INS-000001 }
        nome: { type: string }
        unidadeMedida: { type: string, example: L }
        ativo: { type: boolean, example: false }
        dataDesativacao: { type: string, format: date-time }
        usuarioDesativacao: { type: string, format: uuid }
    ListaInsumos:
      type: object
      description: Envelope paginado padrão da API.
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/InsumoConsulta' }
        pagina: { type: integer }
        tamanho: { type: integer }
        totalElementos: { type: integer }
        totalPaginas: { type: integer }
    ProcessarInsumosCompraReserva:
      type: object
      required: [ordemServicoId, fornecedorId, itens]
      additionalProperties: false
      properties:
        ordemServicoId: { type: string, format: uuid }
        fornecedorId: { type: string, format: uuid }
        itens:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, quantidade]
            additionalProperties: false
            properties:
              itemId: { type: string, format: uuid }
              quantidade:
                type: number
                format: double
                minimum: 0
                exclusiveMinimum: true
                example: 2.5
    ResultadoProcessarInsumosCompraReserva:
      type: object
      properties:
        ordemServicoId: { type: string, format: uuid }
        statusOrdemServico: { type: string, enum: [AGUARDANDO_EXECUCAO, AGUARDANDO_RECURSOS] }
        insumosReservados:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string, format: uuid }
              quantidade: { type: number, format: double }
              saldoDisponivelApos: { type: number, format: double }
        insumosCompraSolicitada:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string, format: uuid }
              quantidade: { type: number, format: double }
              valorParcial: { type: number, format: double }
        fornecedor:
          type: object
          properties:
            id: { type: string, format: uuid }
            nome: { type: string }
        valorTotalCompraParcial: { type: number, format: double }
    RegistrarEntrada:
      type: object
      required: [documentoOrigem, itens]
      additionalProperties: false
      properties:
        documentoOrigem: { type: string, minLength: 1, example: NF-88421 }
        fornecedorId: { type: string, format: uuid }
        pedidoCompraId: { type: string, format: uuid }
        confirmarDivergencia: { type: boolean, default: false }
        itens:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [itemId, quantidade, custoUnitario]
            properties:
              itemId: { type: string, format: uuid }
              quantidade: { type: number, format: double, exclusiveMinimum: true, minimum: 0 }
              custoUnitario: { type: number, format: double, exclusiveMinimum: true, minimum: 0 }
    EntradaRegistrada:
      type: object
      required: [entradaId, documentoOrigem, registradoEm, itens]
      properties:
        entradaId: { type: string, format: uuid }
        documentoOrigem: { type: string }
        registradoEm: { type: string, format: date-time }
        registradoPor: { type: string, format: uuid }
        itens:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string, format: uuid }
              codigo: { type: string }
              unidadeMedida: { type: string }
              quantidade: { type: number, format: double }
              saldoFisicoAnterior: { type: number, format: double }
              saldoFisicoAtual: { type: number, format: double }
              saldoReservado: { type: number, format: double }
              saldoDisponivel: { type: number, format: double }
        pedidoCompra:
          type: object
          properties:
            id: { type: string, format: uuid }
            numero: { type: string }
            status: { type: string, enum: [ABERTO, PARCIAL, CONCLUIDO] }
        ordensServico:
          type: array
          items:
            type: object
            properties:
              ordemServicoId: { type: string, format: uuid }
              statusAnterior: { type: string }
              status: { type: string }
              itensPendentes: { type: integer }
    CadastrarFornecedor:
      type: object
      required: [razaoSocial, documento, tipoDocumento]
      properties:
        razaoSocial: { type: string, minLength: 3, maxLength: 120 }
        nomeFantasia: { type: string, maxLength: 120 }
        documento: { type: string }
        tipoDocumento: { type: string, enum: [CPF, CNPJ] }
        telefone: { type: string }
        email: { type: string, format: email }
        prazoEntregaDias: { type: integer, minimum: 1, maximum: 365, default: 7 }
    AtualizarFornecedor:
      type: object
      required: [razaoSocial]
      properties:
        razaoSocial: { type: string, minLength: 3, maxLength: 120 }
        nomeFantasia: { type: string, maxLength: 120 }
        telefone: { type: string }
        email: { type: string, format: email }
        prazoEntregaDias: { type: integer, minimum: 1, maximum: 365 }
    Fornecedor:
      allOf:
        - $ref: '#/components/schemas/CadastrarFornecedor'
        - type: object
          required: [id, ativo, version, dataCriacao]
          properties:
            id: { type: string, format: uuid }
            ativo: { type: boolean }
            version: { type: integer }
            dataCriacao: { type: string, format: date-time }
    CadastrarVeiculo:
      type: object
      required: [placa, marca, modelo, ano]
      properties:
        placa: { type: string, example: ABC1D23 }
        marca: { type: string, example: Toyota }
        modelo: { type: string, example: Corolla }
        ano: { type: integer, example: 2024 }
