openapi: 3.0.3
info:
  title: Oficina Mecânica API
  version: 0.1.0
tags:
  - name: Veículos
paths:
  /veiculos:
    get:
      tags: [Veículos]
      summary: Consulta um veículo pela placa
      parameters:
        - name: placa
          in: query
          required: true
          schema: { type: string, example: ABC1D23 }
        - name: incluirInativos
          in: query
          required: true
          schema: { type: boolean }
      responses:
        '200': { description: Veículo encontrado }
        '400': { description: Parâmetros inválidos }
        '404': { description: Veículo não encontrado }
  /clientes/{clienteId}/veiculos:
    post:
      tags: [Veículos]
      summary: Cadastra um veículo e o vincula ao cliente
      parameters:
        - name: clienteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastrarVeiculo'
      responses:
        '201':
          description: Veículo cadastrado e vinculado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Veiculo'
        '400': { description: Dados inválidos }
        '404': { description: Cliente não encontrado }
        '409': { description: Cliente inativo ou placa já cadastrada }
        '500': { description: Falha inesperada }
components:
  schemas:
    CadastrarVeiculo:
      type: object
      required: [placa, marca, modelo, ano]
      properties:
        placa:
          type: string
          pattern: '^[A-Za-z]{3}[- ]?[0-9][A-Za-z0-9][0-9]{2}$'
          example: ABC1D23
        marca: { type: string, example: Toyota }
        modelo: { type: string, example: Corolla }
        ano: { type: integer, minimum: 1900, example: 2024 }
    Veiculo:
      allOf:
        - $ref: '#/components/schemas/CadastrarVeiculo'
        - type: object
          required: [id, clienteId, ativo]
          properties:
            id: { type: string, format: uuid }
            clienteId: { type: string, format: uuid }
            ativo: { type: boolean, example: true }
