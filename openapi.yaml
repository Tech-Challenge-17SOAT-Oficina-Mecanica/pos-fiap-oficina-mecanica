openapi: 3.0.3
info:
  title: Oficina Mecanica API
  description: API do sistema de gestao de oficina mecanica.
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Verifica a disponibilidade da API
      responses:
        '200':
          description: API disponivel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /fornecedores:
    get:
      tags: [Fornecedores]
      summary: Lista fornecedores cadastrados
      security:
        - bearerAuth: []
      parameters:
        - name: nome
          in: query
          schema:
            type: string
          description: Filtro parcial por razao social ou nome fantasia.
        - name: documento
          in: query
          schema:
            type: string
          description: Filtro exato por documento, somente digitos.
        - name: incluirInativos
          in: query
          schema:
            type: boolean
            default: false
        - name: pagina
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: tamanho
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Consulta realizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FornecedoresPage'
        '400':
          description: Filtro ou paginacao invalidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Token ausente ou expirado
        '403':
          description: Escopo insuficiente
    post:
      tags: [Fornecedores]
      summary: Cadastra um fornecedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastrarFornecedor'
      responses:
        '201':
          description: Fornecedor cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fornecedor'
        '400':
          description: Dados invalidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Documento duplicado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /fornecedores/{fornecedorId}:
    get:
      tags: [Fornecedores]
      summary: Consulta um fornecedor pelo identificador
      security:
        - bearerAuth: []
      parameters:
        - name: fornecedorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fornecedor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fornecedor'
        '400':
          description: Identificador invalido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Token ausente ou expirado
        '403':
          description: Escopo insuficiente
        '404':
          description: Fornecedor nao encontrado
    put:
      tags: [Fornecedores]
      summary: Atualiza um fornecedor
      security:
        - bearerAuth: []
      parameters:
        - name: fornecedorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: Version atual do fornecedor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarFornecedor'
      responses:
        '200':
          description: Fornecedor atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FornecedorAtualizado'
        '400':
          description: Dados invalidos ou campo imutavel enviado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Token ausente ou expirado
        '403':
          description: Escopo insuficiente
        '404':
          description: Fornecedor nao encontrado
        '409':
          description: Fornecedor inativo
        '412':
          description: If-Match divergente
        '428':
          description: If-Match nao informado
  /autenticacao/login:
    post:
      tags: [Seguranca]
      summary: Autentica um mecanico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  format: email
                senha:
                  type: string
                  format: password
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    example: Bearer
                  expiresIn:
                    type: integer
                    example: 3600
        '400':
          description: Dados invalidos
        '401':
          description: Credenciais invalidas
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CadastrarFornecedor:
      type: object
      required: [razaoSocial, documento, tipoDocumento]
      properties:
        razaoSocial:
          type: string
          minLength: 3
          maxLength: 120
          example: Auto Pecas Bandeirantes Ltda
        nomeFantasia:
          type: string
          maxLength: 120
        documento:
          type: string
          description: CPF ou CNPJ, com ou sem mascara.
          example: 04252011000110
        tipoDocumento:
          type: string
          enum: [CPF, CNPJ]
          example: CNPJ
        telefone:
          type: string
          example: 11999990000
        email:
          type: string
          format: email
        prazoEntregaDias:
          type: integer
          minimum: 1
          maximum: 365
          default: 7
    AtualizarFornecedor:
      type: object
      required: [razaoSocial]
      properties:
        razaoSocial:
          type: string
          minLength: 3
          maxLength: 120
          example: Auto Pecas Bandeirantes Ltda
        nomeFantasia:
          type: string
          maxLength: 120
          example: Bandeirantes Autopecas
        telefone:
          type: string
          example: 1133224466
        email:
          type: string
          format: email
          example: compras@bandeirantes.com.br
        prazoEntregaDias:
          type: integer
          minimum: 1
          maximum: 365
          example: 10
    Fornecedor:
      allOf:
        - $ref: '#/components/schemas/CadastrarFornecedor'
        - type: object
          required: [id, ativo, version, dataCriacao]
          properties:
            id:
              type: string
              format: uuid
            ativo:
              type: boolean
            version:
              type: integer
            dataCriacao:
              type: string
              format: date-time
    FornecedorAtualizado:
      allOf:
        - $ref: '#/components/schemas/CadastrarFornecedor'
        - type: object
          required: [id, ativo, version, dataAtualizacao]
          properties:
            id:
              type: string
              format: uuid
            ativo:
              type: boolean
            version:
              type: integer
            dataAtualizacao:
              type: string
              format: date-time
    FornecedorResumo:
      allOf:
        - $ref: '#/components/schemas/CadastrarFornecedor'
        - type: object
          required: [id, ativo]
          properties:
            id:
              type: string
              format: uuid
            ativo:
              type: boolean
    FornecedoresPage:
      type: object
      required: [data, pagina, tamanho, totalElementos, totalPaginas]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FornecedorResumo'
        pagina:
          type: integer
          example: 0
        tamanho:
          type: integer
          example: 20
        totalElementos:
          type: integer
          example: 1
        totalPaginas:
          type: integer
          example: 1
    FieldError:
      type: object
      properties:
        campo:
          type: string
        mensagem:
          type: string
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        erros:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'