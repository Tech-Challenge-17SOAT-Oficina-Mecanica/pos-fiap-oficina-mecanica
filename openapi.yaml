openapi: 3.0.3
info:
  title: Oficina Mecânica API
  description: API do sistema de gestão de oficina mecânica.
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Verifica a disponibilidade da API
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /fornecedores:
    post:
      tags: [Fornecedores]
      summary: Cadastra um fornecedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastrarFornecedor'
      responses:
        '201':
          description: Fornecedor cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fornecedor'
        '400':
          description: Dados inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Documento duplicado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /autenticacao/login:
    post:
      tags: [Segurança]
      summary: Autentica um mecânico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  format: email
                senha:
                  type: string
                  format: password
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, example: Bearer }
                  expiresIn: { type: integer, example: 3600 }
        '400': { description: Dados inválidos }
        '401': { description: Credenciais inválidas }
components:
  schemas:
    CadastrarFornecedor:
      type: object
      required: [razaoSocial, documento, tipoDocumento]
      properties:
        razaoSocial:
          type: string
          minLength: 3
          maxLength: 120
          example: Auto Peças Bandeirantes Ltda
        nomeFantasia:
          type: string
          maxLength: 120
        documento:
          type: string
          description: CPF ou CNPJ, com ou sem máscara.
          example: 04252011000110
        tipoDocumento:
          type: string
          enum: [CPF, CNPJ]
          example: CNPJ
        telefone:
          type: string
          example: 11999990000
        email:
          type: string
          format: email
        prazoEntregaDias:
          type: integer
          minimum: 1
          maximum: 365
          default: 7
    Fornecedor:
      allOf:
        - $ref: '#/components/schemas/CadastrarFornecedor'
        - type: object
          required: [id, ativo, version, dataCriacao]
          properties:
            id:
              type: string
              format: uuid
            ativo:
              type: boolean
            version:
              type: integer
            dataCriacao:
              type: string
              format: date-time
    FieldError:
      type: object
      properties:
        campo:
          type: string
        mensagem:
          type: string
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        erros:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
