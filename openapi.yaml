openapi: 3.0.3
info:
  title: Oficina Mecânica API
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: Veículos
  - name: Fornecedores
  - name: Orcamentos
  - name: Ordens de Servico
  - name: Mecânico
  - name: Serviço
paths:
  /health:
    get:
      summary: Verifica a disponibilidade da API
      responses:
        '200': { description: API disponível }
  /servicos:
    post:
      tags: [Serviço]
      summary: Cadastra um serviço no catálogo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, valor, tempoEstimadoMinutos]
              additionalProperties: false
              properties:
                nome:
                  type: string
                  example: Troca de óleo
                descricao:
                  type: string
                  example: Troca de óleo e filtro
                valor:
                  type: number
                  format: double
                  minimum: 0
                  example: 150.00
                tempoEstimadoMinutos:
                  type: integer
                  minimum: 1
                  example: 60
      responses:
        '201':
          description: Serviço cadastrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  codigo: { type: string, pattern: '^SER-[0-9]{6}$', example: SER-000004 }
                  nome: { type: string }
                  descricao: { type: string }
                  valor: { type: number, format: double }
                  tempoEstimadoMinutos: { type: integer }
                  ativo: { type: boolean, example: true }
                  version: { type: integer, example: 1 }
                  dataCriacao: { type: string, format: date-time }
        '400': { description: Dados obrigatórios ausentes ou inválidos }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo servicos:escrever }
        '409': { description: Serviço ativo com o mesmo nome normalizado }
        '500': { description: Falha inesperada }
  /fornecedores:
    get:
      tags: [Fornecedores]
      summary: Lista fornecedores cadastrados
      security:
        - bearerAuth: []
      parameters:
        - name: nome
          in: query
          schema: { type: string }
          description: Filtro parcial por razão social ou nome fantasia.
        - name: documento
          in: query
          schema: { type: string }
          description: Filtro exato por CPF/CNPJ, com ou sem máscara.
        - name: incluirInativos
          in: query
          schema: { type: boolean, default: false }
        - name: pagina
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: tamanho
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200': { description: Consulta realizada }
        '400': { description: Filtros ou paginação inválidos }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo compras:ler }
    post:
      tags: [Fornecedores]
      summary: Cadastra um fornecedor
      description: Exige o escopo `compras:escrever`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastrarFornecedor' }
      responses:
        '201':
          description: Fornecedor cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fornecedor' }
        '400': { description: Dados inválidos }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo compras:escrever }
        '409': { description: Documento duplicado }
  /fornecedores/{fornecedorId}:
    get:
      tags: [Fornecedores]
      summary: Consulta um fornecedor pelo identificador
      security:
        - bearerAuth: []
      parameters:
        - name: fornecedorId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Fornecedor encontrado }
        '400': { description: Identificador inválido }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo compras:ler }
        '404': { description: Fornecedor não encontrado }
    put:
      tags: [Fornecedores]
      summary: Atualiza um fornecedor
      security:
        - bearerAuth: []
      parameters:
        - name: fornecedorId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-Match
          in: header
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtualizarFornecedor' }
      responses:
        '200': { description: Fornecedor atualizado }
        '400': { description: Dados inválidos ou campo imutável enviado }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo compras:escrever }
        '404': { description: Fornecedor não encontrado }
        '409': { description: Fornecedor inativo }
        '412': { description: If-Match divergente }
        '428': { description: If-Match não informado }
    delete:
      tags: [Fornecedores]
      summary: Desativa um fornecedor
      security:
        - bearerAuth: []
      parameters:
        - name: fornecedorId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Fornecedor desativado }
        '400': { description: Identificador inválido }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo compras:escrever }
        '404': { description: Fornecedor não encontrado }
        '409': { description: Fornecedor já inativo ou com pedido de compra em aberto }
  /fornecedores/{fornecedorId}/reativacao:
    post:
      tags: [Fornecedores]
      summary: Reativa um fornecedor
      security:
        - bearerAuth: []
      parameters:
        - name: fornecedorId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Fornecedor reativado }
        '400': { description: Identificador inválido }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo compras:escrever }
        '404': { description: Fornecedor não encontrado }
        '409': { description: Fornecedor já ativo ou documento já utilizado }
  /mecanicos/{mecanicoId}:
    put:
      tags: [Mecânico]
      summary: Atualiza cadastro e escopos de um mecânico
      description: Exige o escopo `mecanicos:escrever`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: mecanicoId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
            example: '1'
          description: Version atual do mecânico para controle otimista.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, escopos]
              properties:
                nome:
                  type: string
                  example: Maria Souza
                email:
                  type: string
                  format: email
                  example: maria.souza@oficina.local
                escopos:
                  type: array
                  items:
                    type: string
                  example: [veiculos:ler, veiculos:escrever, os:ler]
      responses:
        '200':
          description: Mecânico atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nome: { type: string }
                  email: { type: string, format: email }
                  ativo: { type: boolean }
                  escopos:
                    type: array
                    items:
                      type: string
                  version: { type: integer }
        '400': { description: Identificador, corpo, e-mail, If-Match ou escopo inválido }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo mecanicos:escrever }
        '404': { description: Mecânico não encontrado }
        '409': { description: E-mail já cadastrado para outro usuário }
        '412': { description: If-Match divergente }
        '428': { description: If-Match ausente }
  /veiculos:
    get:
      tags: [Veículos]
      summary: Consulta um veículo pela placa
      description: Exige o escopo `veiculos:ler`.
      security:
        - bearerAuth: []
      parameters:
        - name: placa
          in: query
          required: true
          schema: { type: string, example: ABC1D23 }
        - name: incluirInativos
          in: query
          required: true
          schema: { type: boolean }
      responses:
        '200': { description: Veículo encontrado }
        '400': { description: Parâmetros inválidos }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo veiculos:ler }
        '404': { description: Veículo não encontrado }
  /clientes/{clienteId}/veiculos:
    post:
      tags: [Veículos]
      summary: Cadastra um veículo e o vincula ao cliente
      description: Exige o escopo `veiculos:escrever`.
      security:
        - bearerAuth: []
      parameters:
        - name: clienteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastrarVeiculo' }
      responses:
        '201': { description: Veículo cadastrado }
        '400': { description: Dados inválidos }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo veiculos:escrever }
        '404': { description: Cliente não encontrado }
        '409': { description: Cliente inativo ou placa já cadastrada }
  /clientes:
    get:
      tags: [Cliente]
      summary: Consulta cliente por CPF/CNPJ
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: documento
          required: true
          schema:
            type: string
            example: '39053344705'
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nome: { type: string }
                  documento: { type: string }
                  tipoDocumento: { type: string, enum: [CPF, CNPJ] }
                  telefone: { type: string }
                  email: { type: string, format: email }
                  ativo: { type: boolean }
                  version: { type: integer }
                  veiculos:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        placa: { type: string }
                        marca: { type: string }
                        modelo: { type: string }
                        ano: { type: integer }
        '400': { description: CPF/CNPJ ausente ou inválido }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo clientes:ler }
        '404': { description: Cliente não encontrado }
    post:
      tags: [Cliente]
      summary: Cadastra um cliente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, documento, tipoDocumento]
              properties:
                nome:
                  type: string
                  example: Ana Martins
                documento:
                  type: string
                  example: '12345678909'
                tipoDocumento:
                  type: string
                  enum: [CPF, CNPJ]
                telefone:
                  type: string
                  example: '11988887777'
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Cliente cadastrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nome: { type: string }
                  documento: { type: string }
                  tipoDocumento: { type: string, enum: [CPF, CNPJ] }
                  telefone: { type: string }
                  email: { type: string, format: email }
        '400': { description: Dados obrigatórios ausentes ou inválidos }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo clientes:escrever }
        '409': { description: Cliente já cadastrado }
  /clientes/{clienteId}:
    put:
      tags: [Cliente]
      summary: Atualiza um cliente
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clienteId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
            example: '1'
          description: Version atual do cliente para controle otimista.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, documento, tipoDocumento]
              properties:
                nome:
                  type: string
                  example: Ana Martins
                documento:
                  type: string
                  example: '39053344705'
                tipoDocumento:
                  type: string
                  enum: [CPF, CNPJ]
                telefone:
                  type: string
                  example: '11988887777'
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Cliente atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nome: { type: string }
                  documento: { type: string }
                  tipoDocumento: { type: string, enum: [CPF, CNPJ] }
                  telefone: { type: string }
                  email: { type: string, format: email }
                  ativo: { type: boolean }
                  version: { type: integer }
        '400': { description: Identificador, dados ou If-Match inválidos }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo clientes:escrever }
        '404': { description: Cliente não encontrado }
        '409': { description: CPF/CNPJ já vinculado a outro cliente }
        '412': { description: If-Match divergente }
        '428': { description: If-Match não informado }
    delete:
      tags: [Cliente]
      summary: Inativa um cliente
      description: Executa exclusão lógica do cliente e inativa os veículos vinculados.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clienteId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: motivo
          required: false
          schema:
            type: string
            maxLength: 200
            example: Cadastro duplicado
      responses:
        '200':
          description: Cliente inativado
          content:
            application/json:
              schema:
                type: object
                properties:
                  clienteId: { type: string, format: uuid }
                  nome: { type: string }
                  ativo: { type: boolean, example: false }
                  inativadoEm: { type: string, format: date-time }
                  inativadoPor: { type: string, format: uuid }
                  motivo: { type: string }
                  veiculosInativados:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        placa: { type: string }
                  documentoLiberadoParaNovoCadastro: { type: boolean, example: true }
        '204': { description: Cliente já estava inativo }
        '400': { description: clienteId inválido ou motivo acima do limite }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo clientes:escrever }
        '404': { description: Cliente não encontrado }
        '409':
          description: Cliente possui Ordem de Serviço em aberto
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type: { type: string, example: 'https://api.oficina-mecanica.dev/errors/cliente-com-os-aberta' }
                  title: { type: string, example: Cliente possui Ordem de Serviço em aberto }
                  status: { type: integer, example: 409 }
                  detail: { type: string }
                  erros:
                    type: array
                    items:
                      type: object
                      properties:
                        ordemServicoId: { type: string, format: uuid }
                        status: { type: string, example: EM_EXECUCAO }
  /veiculos/{veiculoId}:
    put:
      tags: [Veículos]
      summary: Atualiza os dados de um veículo
      description: Exige o escopo `veiculos:escrever`.
      security:
        - bearerAuth: []
      parameters:
        - name: veiculoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-Match
          in: header
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastrarVeiculo' }
      responses:
        '200': { description: Veículo atualizado }
        '400': { description: Dados inválidos }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo veiculos:escrever }
        '404': { description: Veículo não encontrado }
        '409': { description: Placa já cadastrada }
        '412': { description: Versão divergente }
        '428': { description: If-Match ausente }
    delete:
      tags: [Veículos]
      summary: Inativa um veículo
      security:
        - bearerAuth: []
      parameters:
        - name: veiculoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: motivo
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        '200': { description: Veículo inativado }
        '204': { description: Veículo já inativo }
        '400': { description: Identificador ou motivo inválido }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo veiculos:escrever }
        '404': { description: Veículo não encontrado }
        '409': { description: Veículo possui OS em aberto }
  /veiculos/{veiculoId}/reativacao:
    post:
      tags: [Veículos]
      summary: Reativa um veículo
      security:
        - bearerAuth: []
      parameters:
        - name: veiculoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Veículo reativado }
        '401': { description: Token ausente, inválido ou expirado }
        '403': { description: Usuário sem o escopo veiculos:escrever }
        '404': { description: Veículo não encontrado }
        '409': { description: Veículo ativo, placa em uso ou cliente inativo }
  /clientes/{clienteId}/reativacao:
    post:
      tags: [Cliente]
      summary: Reativa um cliente
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clienteId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cliente reativado
          content:
            application/json:
              schema:
                type: object
                properties:
                  clienteId: { type: string, format: uuid }
                  nome: { type: string }
                  ativo: { type: boolean, example: true }
                  reativadoEm: { type: string, format: date-time }
                  reativadoPor: { type: string, format: uuid }
                  veiculosReativados: { type: integer, example: 0 }
        '400': { description: clienteId inválido }
        '401': { description: Token ausente ou expirado }
        '403': { description: Usuário sem o escopo clientes:escrever }
        '404': { description: Cliente não encontrado }
        '409': { description: Cliente já ativo ou CPF/CNPJ usado por outro cliente ativo }
  /autenticacao/login:
    post:
      tags: [Segurança]
      summary: Autentica um mecânico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  format: email
                  example: mecanico@oficina.local
                senha:
                  type: string
                  format: password
                  example: mecanico123
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, example: Bearer }
                  expiresIn: { type: integer, example: 3600 }
        '400': { description: Dados inválidos }
        '401': { description: Credenciais inválidas }
  /ordens-servico/{osId}/problemas:
    post:
      tags: [Ordens de Servico]
      summary: Registra um problema encontrado na ordem de servico
      description: Exige o escopo `os:escrever`. O orcamento aplicavel e definido pelo status da OS.
      security:
        - bearerAuth: []
      parameters:
        - name: osId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrarProblema' }
      responses:
        '201':
          description: Problema registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemaRegistrado' }
        '400': { description: Identificador ou dados invalidos }
        '401': { description: Token ausente, invalido ou expirado }
        '403': { description: Usuario sem o escopo os:escrever }
        '404': { description: Ordem de servico nao encontrada }
        '409': { description: Status da OS ou orcamento nao permite o registro }
  /ordens-servico/{osId}/orcamento:
    get:
      tags: [Orcamentos]
      summary: Consulta os orcamentos de uma Ordem de Servico
      description: Mecanicos exigem `os:ler`. Clientes usam token temporario com `orcamentos:ler`, restrito a propria OS.
      security:
        - bearerAuth: []
      parameters:
        - name: osId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Orcamentos consultados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultaOrcamento' }
        '400': { description: Identificador invalido }
        '401': { description: Token ausente, invalido ou expirado }
        '403': { description: Cliente sem acesso a OS }
        '404': { description: OS ou orcamento nao encontrado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ConsultaOrcamento:
      type: object
      required: [cliente, ordemServicoId, statusOrdemServico, orcamentos, valorTotalGeral]
      properties:
        cliente:
          type: object
          required: [clienteId, nome, documento, tipoDocumento]
          properties:
            clienteId: { type: string, format: uuid }
            nome: { type: string }
            documento: { type: string }
            tipoDocumento: { type: string, enum: [CPF, CNPJ] }
        ordemServicoId: { type: string, format: uuid }
        statusOrdemServico: { type: string }
        valorTotalGeral: { type: number, format: double }
        estimativaEntregaDias: { type: integer, minimum: 0 }
        orcamentos:
          type: array
          items:
            type: object
            required: [orcamentoId, tipoOrcamento, statusOrcamento, itens, valorTotal]
            properties:
              orcamentoId: { type: string, format: uuid }
              orcamentoOriginalId: { type: string, format: uuid }
              tipoOrcamento: { type: string, enum: [PRINCIPAL, COMPLEMENTAR] }
              statusOrcamento: { type: string, enum: [CRIADO, APROVADO, RECUSADO] }
              estimativaEntregaDias: { type: integer, minimum: 0 }
              dataGeracao: { type: string, format: date-time }
              valorTotal: { type: number, format: double }
              itens:
                type: array
                items:
                  type: object
                  properties:
                    tipo: { type: string }
                    descricao: { type: string }
                    quantidade: { type: number, format: double }
                    valorUnitario: { type: number, format: double }
                    valorTotal: { type: number, format: double }
              problemas:
                type: array
                items:
                  type: object
                  properties:
                    problemaId: { type: string, format: uuid }
                    descricao: { type: string }
                    observacoes: { type: string }
                    registradoEm: { type: string, format: date-time }
    RegistrarProblema:
      type: object
      required: [descricao]
      additionalProperties: false
      properties:
        descricao: { type: string, minLength: 1, example: Pastilhas de freio desgastadas }
        observacoes: { type: string, example: Desgaste acima do limite recomendado }
    ProblemaRegistrado:
      type: object
      required: [problemaId, descricao, orcamento]
      properties:
        problemaId: { type: string, format: uuid }
        descricao: { type: string }
        observacoes: { type: string }
        orcamento:
          type: object
          required: [id, tipo, status]
          properties:
            id: { type: string, format: uuid }
            tipo: { type: string, enum: [PRINCIPAL, COMPLEMENTAR] }
            status: { type: string, enum: [CRIADO] }
    CadastrarFornecedor:
      type: object
      required: [razaoSocial, documento, tipoDocumento]
      properties:
        razaoSocial: { type: string, minLength: 3, maxLength: 120 }
        nomeFantasia: { type: string, maxLength: 120 }
        documento: { type: string }
        tipoDocumento: { type: string, enum: [CPF, CNPJ] }
        telefone: { type: string }
        email: { type: string, format: email }
        prazoEntregaDias: { type: integer, minimum: 1, maximum: 365, default: 7 }
    AtualizarFornecedor:
      type: object
      required: [razaoSocial]
      properties:
        razaoSocial: { type: string, minLength: 3, maxLength: 120 }
        nomeFantasia: { type: string, maxLength: 120 }
        telefone: { type: string }
        email: { type: string, format: email }
        prazoEntregaDias: { type: integer, minimum: 1, maximum: 365 }
    Fornecedor:
      allOf:
        - $ref: '#/components/schemas/CadastrarFornecedor'
        - type: object
          required: [id, ativo, version, dataCriacao]
          properties:
            id: { type: string, format: uuid }
            ativo: { type: boolean }
            version: { type: integer }
            dataCriacao: { type: string, format: date-time }
    CadastrarVeiculo:
      type: object
      required: [placa, marca, modelo, ano]
      properties:
        placa: { type: string, example: ABC1D23 }
        marca: { type: string, example: Toyota }
        modelo: { type: string, example: Corolla }
        ano: { type: integer, example: 2024 }
