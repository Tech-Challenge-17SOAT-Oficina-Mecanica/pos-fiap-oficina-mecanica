name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    container: golang:1.25-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build application
        run: CGO_ENABLED=0 GOOS=linux go build -o oficina-mecanica ./cmd/oficina-mecanica
