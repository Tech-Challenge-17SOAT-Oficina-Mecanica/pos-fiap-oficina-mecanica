name: 1.0 · 🏗️ Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      build-package:
        description: Pacote ou padrão Go a compilar
        type: string
        default: ./...
      database:
        description: Use postgres para habilitar a preparação do banco da oficina
        type: string
        default: none
      coverage-packages:
        description: Pacotes Go a testar para cobertura, separados por espaços
        type: string
        default: ./...
      coverage-scope:
        description: Padrão Go para o denominador da cobertura
        type: string
        default: ./...
    secrets:
      CI_DB_PASSWORD:
        required: false
      JWT_SECRET:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: 🔨 Build application
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: ⚙️ Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 🔨 Build application
        env:
          BUILD_PACKAGE: ${{ inputs.build-package || './cmd/oficina-mecanica' }}
        run: CGO_ENABLED=0 GOOS=linux go build "$BUILD_PACKAGE"

  test:
    name: 🧪 Test application
    needs: build
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DATABASE_URL: ${{ (inputs.database || 'postgres') == 'postgres' && format('postgres://oficina:{0}@localhost:5432/oficina?sslmode=disable', secrets.CI_DB_PASSWORD) || '' }}

    services:
      postgres:
        image: ${{ (inputs.database || 'postgres') == 'postgres' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_DB: oficina
          POSTGRES_USER: oficina
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oficina -d oficina"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: ⚙️ Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 🗃️ Init database
        if: ${{ (inputs.database || 'postgres') == 'postgres' }}
        run: |
          docker run --rm \
            --network "${{ job.services.postgres.network }}" \
            -v "${{ github.workspace }}:/workspace" \
            -e PGPASSWORD="$DB_PASSWORD" \
            postgres:16-alpine \
            sh -ec 'for migration in /workspace/db/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -h postgres -U oficina -d oficina < "$migration"; done; psql -v ON_ERROR_STOP=1 -h postgres -U oficina -d oficina < /workspace/db/seeds/V900__dados_iniciais.sql'

      - name: 🧪 Run tests
        run: go test ./...

  coverage:
    name: 📊 Check coverage
    needs: build
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DATABASE_URL: ${{ (inputs.database || 'postgres') == 'postgres' && format('postgres://oficina:{0}@localhost:5432/oficina?sslmode=disable', secrets.CI_DB_PASSWORD) || '' }}

    services:
      postgres:
        image: ${{ (inputs.database || 'postgres') == 'postgres' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_DB: oficina
          POSTGRES_USER: oficina
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oficina -d oficina"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: ⚙️ Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 🗃️ Init database
        if: ${{ (inputs.database || 'postgres') == 'postgres' }}
        run: |
          docker run --rm \
            --network "${{ job.services.postgres.network }}" \
            -v "${{ github.workspace }}:/workspace" \
            -e PGPASSWORD="$DB_PASSWORD" \
            postgres:16-alpine \
            sh -ec 'for migration in /workspace/db/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -h postgres -U oficina -d oficina < "$migration"; done; psql -v ON_ERROR_STOP=1 -h postgres -U oficina -d oficina < /workspace/db/seeds/V900__dados_iniciais.sql'

      - name: 📊 Enforce minimum coverage
        env:
          COVERAGE_PACKAGES: ${{ inputs.coverage-packages || './internal/... ./tests/integration/...' }}
          COVERAGE_SCOPE: ${{ inputs.coverage-scope || './internal/...' }}
        run: |
          read -ra packages <<< "$COVERAGE_PACKAGES"
          go test -covermode=atomic -coverpkg="$COVERAGE_SCOPE" -coverprofile=coverage.out "${packages[@]}"
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); print $3 }')
          if [ -z "$coverage" ] || ! awk "BEGIN { exit !($coverage >= 80) }"; then
            echo "::error::Cobertura total ${coverage:-indisponivel}%. O mínimo é 80%."
            exit 1
          fi
          echo "Cobertura total: $coverage% (mínimo: 80%)."
