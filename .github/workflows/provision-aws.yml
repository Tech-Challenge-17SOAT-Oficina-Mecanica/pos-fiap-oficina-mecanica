name: 02 · 🏗️ Prepare AWS infrastructure

on:
  workflow_dispatch:
    inputs:
      admin_cidr:
        description: Opcional - seu IPv4 publico com /32 para acessar pelo computador
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: oficina-aws-${{ vars.AWS_ACCOUNT_ID }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ADMIN_CIDR: ${{ inputs.admin_cidr }}
      CLUSTER_NAME: ${{ vars.AWS_CLUSTER_NAME || 'oficina-academy' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'oficina-mecanica' }}
      AWS_VPC_ID: ${{ vars.AWS_VPC_ID }}
      AWS_EKS_CLUSTER_ROLE: ${{ vars.AWS_EKS_CLUSTER_ROLE }}
      AWS_EKS_NODE_ROLE: ${{ vars.AWS_EKS_NODE_ROLE }}
    steps:
      - name: Validate configured account
        run: '[[ "$EXPECTED_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "Configure a Variable AWS_ACCOUNT_ID com 12 digitos."; exit 1; }'
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - name: Prepare infrastructure without deploying application
        env:
          TF_VAR_db_password: ${{ secrets.AWS_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.AWS_JWT_SECRET }}
        run: bash scripts/provision-aws.sh
