name: 03 · 🐳 Docker Build and Deploy

on:
  workflow_dispatch:

concurrency:
  group: oficina-aws-${{ vars.AWS_ACCOUNT_ID }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'oficina-mecanica' }}
  CLUSTER_NAME: ${{ vars.AWS_CLUSTER_NAME || 'oficina-academy' }}
  EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  SOURCE_SHA: ${{ github.sha }}
  DEPLOY_REF: ${{ github.ref }}

jobs:
  build-and-push:
    name: 🐳 Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Validate configured account
        run: '[[ "$EXPECTED_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "Configure a Variable AWS_ACCOUNT_ID com 12 digitos."; exit 1; }'
      - name: 🔎 Verify CI for selected commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in build.yml deploy-validation.yml; do
            successful_runs=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f head_sha="$SOURCE_SHA" -f status=success --jq '.workflow_runs | length')
            if [[ "$successful_runs" -eq 0 ]]; then
              echo "::error::Wait for $workflow to pass for this commit before retrying."
              exit 1
            fi
          done

      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: ⚙️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm destination account
        run: |
          actual=$(aws sts get-caller-identity --query Account --output text)
          test "$actual" = "$EXPECTED_ACCOUNT_ID" || { echo 'Unexpected AWS account'; exit 1; }

      - name: 🔑 Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🗃️ Build and push migrations image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.migrations
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.SOURCE_SHA }}-migrations
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

  deploy:
    name: 🚀 Migrate database and deploy API
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout published source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ⚙️ Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0

      - name: ⚙️ Setup Kustomize
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/kustomize.tar.gz"
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP" kustomize
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Confirm destination account
        run: |
          actual=$(aws sts get-caller-identity --query Account --output text)
          test "$actual" = "$EXPECTED_ACCOUNT_ID" || { echo 'Unexpected AWS account'; exit 1; }

      - name: ☸️ Configure cluster access
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: 🗃️ Migrate database and deploy API
        shell: bash
        run: |
          bash scripts/with-eks-access.sh bash -ec '
            kubectl wait --for=condition=Ready nodes --all --timeout=180s
            kubectl wait --for=condition=Available apiservice/v1beta1.metrics.k8s.io --timeout=180s
            bash scripts/deploy-eks.sh
          '
