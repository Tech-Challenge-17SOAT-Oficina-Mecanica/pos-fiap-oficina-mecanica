name: 1.2 · ⏱️ API performance

on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'db/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - 'tests/performance/**'
      - 'scripts/test-performance.sh'
      - '.github/workflows/performance.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'db/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - 'tests/performance/**'
      - 'scripts/test-performance.sh'
      - '.github/workflows/performance.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil de carga
        required: true
        default: load
        type: choice
        options: [smoke, load]

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    name: 🧪 Test API performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PERF_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'smoke' }}
    steps:
      - name: 📥 Obter código
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 🚀 Executar teste de desempenho
        id: load
        run: bash scripts/test-performance.sh "$PERF_PROFILE"
      - name: 📊 Publicar status e resumo
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.load.outcome }}
        run: |
          if [[ "$TEST_OUTCOME" == success ]]; then
            echo "## ✅ Teste de desempenho aprovado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Teste de desempenho não concluído com sucesso" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f reports/performance/summary.md ]]; then
            cat reports/performance/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '⚠️ O teste não gerou métricas. Consulte os logs de preparação do ambiente.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 📦 Salvar relatórios e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/performance/
          if-no-files-found: warn
          retention-days: 14
