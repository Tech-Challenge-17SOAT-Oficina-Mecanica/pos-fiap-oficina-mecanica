services:
  app:
    build:
      context: .
    container_name: oficina-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: oficina
      DB_USER: oficina
      DB_PASSWORD: oficina
      JWT_SECRET: desenvolvimento-apenas-troque-em-producao
      # Notificacoes: por padrao vao para o Mailpit, que captura tudo localmente.
      # Definir RESEND_API_KEY no seu shell troca para envio real, que tem prioridade.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-Oficina Mecanica <oficina@example.com>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICACAO_INTERVALO_SEGUNDOS: ${NOTIFICACAO_INTERVALO_SEGUNDOS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Captura os e-mails em desenvolvimento: nada sai para a internet.
  # Interface web em http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: oficina-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500

  swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: oficina-swagger
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /tmp/openapi.yaml
    volumes:
      - ./openapi.yaml:/tmp/openapi.yaml:ro
    depends_on:
      app:
        condition: service_started

  adminer:
    image: adminer:latest
    container_name: oficina-adminer
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  test:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: postgres://oficina:oficina@postgres:5432/oficina?sslmode=disable
      JWT_SECRET: desenvolvimento-apenas-troque-em-producao
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "go test -cover ./..."

  postgres:
    image: postgres:16-alpine
    container_name: oficina-postgres
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
