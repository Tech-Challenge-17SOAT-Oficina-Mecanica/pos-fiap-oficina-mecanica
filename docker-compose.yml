services:
  app:
    build:
      context: .
    container_name: oficina-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: oficina
      DB_USER: oficina
      DB_PASSWORD: oficina
      JWT_SECRET: desenvolvimento-apenas-troque-em-producao
    depends_on:
      postgres:
        condition: service_healthy

  swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: oficina-swagger
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /tmp/openapi.yaml
    volumes:
      - ./openapi.yaml:/tmp/openapi.yaml:ro
    depends_on:
      app:
        condition: service_started

  test:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: postgres://oficina:oficina@postgres:5432/oficina?sslmode=disable
      JWT_SECRET: desenvolvimento-apenas-troque-em-producao
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "go test -cover ./..."

  postgres:
    image: postgres:16-alpine
    container_name: oficina-postgres
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
