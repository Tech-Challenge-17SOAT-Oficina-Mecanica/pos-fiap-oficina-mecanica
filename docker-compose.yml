services:
  app:
    build:
      context: .
    container_name: oficina-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-oficina}
      DB_USER: ${DB_USER:-oficina}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obrigatoria}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatorio}
    depends_on:
      postgres:
        condition: service_healthy

  swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: oficina-swagger
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /tmp/openapi.yaml
    volumes:
      - ./openapi.yaml:/tmp/openapi.yaml:ro
    depends_on:
      app:
        condition: service_started

  adminer:
    image: adminer:latest
    container_name: oficina-adminer
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  sonarqube:
    image: sonarqube:community
    container_name: oficina-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  sonar-scanner:
    image: ${SONAR_SCANNER_IMAGE:-sonarsource/sonar-scanner-cli:latest}
    profiles:
      - tools
    environment:
      SONAR_HOST_URL: ${SONAR_HOST_URL:-http://sonarqube:9000}
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - .:/usr/src
    depends_on:
      - sonarqube

  test:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: postgres://${DB_USER:-oficina}:${DB_PASSWORD:?DB_PASSWORD obrigatoria}@postgres:5432/${DB_NAME:-oficina}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatorio}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "go test -cover ./..."

  postgres:
    image: postgres:16-alpine
    container_name: oficina-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-oficina}
      POSTGRES_USER: ${DB_USER:-oficina}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obrigatoria}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
